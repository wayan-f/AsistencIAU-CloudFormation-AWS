AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AsistencIAU - Frontend y Backend en AWS EC2 (Ubuntu 24.04) con plantillas anidadas.
  Mantiene dos servidores publicos como el archivo original, pero limita el acceso SSH.
Parameters:
  Proyecto:
    Type: String
    Default: asistencia
    Description: Nombre del proyecto (se usa en nombres y etiquetas)
  Ambiente:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
    Description: Ambiente a desplegar
  TipoInstancia:
    Type: String
    Default: t3.micro
    Description: Tamano de las dos VMs
  LlavePublica:
    Type: String
    NoEcho: true
    Description: Contenido de la llave SSH publica (~/.ssh/aws-backend.pub)
  SshCidr:
    Type: String
    Description: Tu IP publica en formato x.x.x.x/32 (nunca 0.0.0.0/0)
    AllowedPattern: '^(?!0\.0\.0\.0/0$)(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$'
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Imagen Ubuntu 24.04 oficial (AWS la busca sola)
  TemplatesBucket:
    Type: String
    Description: Nombre del bucket S3 con las plantillas secundarias
  TemplatesPrefix:
    Type: String
    Default: cloudformation/anidados
    Description: Ruta de las plantillas secundarias dentro de S3
Resources:
  # 1. Red: VPC, subred publica, Internet Gateway y rutas
  Red:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${TemplatesPrefix}/red.yaml'
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
  # 2. Firewall del FRONTEND y BACKEND (SSH limitado a tu IP)
  Seguridad:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${TemplatesPrefix}/seguridad.yaml'
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
        VpcId: !GetAtt Red.Outputs.VpcId
        SshCidr: !Ref SshCidr
  # 3. Servidor FRONTEND (misma plantilla reutilizable)
  Frontend:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${TemplatesPrefix}/servidor.yaml'
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
        Rol: frontend
        TipoInstancia: !Ref TipoInstancia
        UbuntuAmi: !Ref UbuntuAmi
        LlavePublica: !Ref LlavePublica
        SubnetId: !GetAtt Red.Outputs.SubnetPublicaId
        SecurityGroupId: !GetAtt Seguridad.Outputs.FrontendSGId
  # 4. Servidor BACKEND (misma plantilla reutilizable)
  Backend:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${TemplatesPrefix}/servidor.yaml'
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
        Rol: backend
        TipoInstancia: !Ref TipoInstancia
        UbuntuAmi: !Ref UbuntuAmi
        LlavePublica: !Ref LlavePublica
        SubnetId: !GetAtt Red.Outputs.SubnetPublicaId
        SecurityGroupId: !GetAtt Seguridad.Outputs.BackendSGId
Outputs:
  IpFrontend:
    Description: IP publica del servidor frontend
    Value: !GetAtt Frontend.Outputs.IpPublica
  IpBackend:
    Description: IP publica del servidor backend
    Value: !GetAtt Backend.Outputs.IpPublica
  SshFrontend:
    Value: !Sub
      - 'ssh -i ~/.ssh/aws-backend ubuntu@${IP}'
      - IP: !GetAtt Frontend.Outputs.IpPublica
  SshBackend:
    Value: !Sub
      - 'ssh -i ~/.ssh/aws-backend ubuntu@${IP}'
      - IP: !GetAtt Backend.Outputs.IpPublica
