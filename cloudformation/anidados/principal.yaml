
AWSTemplateFormatVersion: "2010-09-09"

Description: >
  AsistencIAU - Frontend y Backend en AWS EC2 (Ubuntu 24.04)
  utilizando plantillas anidadas de CloudFormation.
  Despliega dos servidores publicos con acceso SSH restringido.

Parameters:

  Proyecto:
    Type: String
    Default: asistencia
    Description: Nombre del proyecto

  Ambiente:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - prod
    Description: Ambiente de despliegue

  TipoInstancia:
    Type: String
    Default: t3.micro
    Description: Tipo de instancia EC2 para frontend y backend

  LlavePublica:
    Type: String
    NoEcho: true
    Description: Contenido de la llave publica SSH

  SshCidr:
    Type: String
    Description: IP publica autorizada para SSH en formato x.x.x.x/32
    AllowedPattern: '^(?!0\.0\.0\.0/0$)(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$'

  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: AMI oficial de Ubuntu 24.04

  TemplatesBucket:
    Type: String
    Default: asistencia-cfn-dev-677265516068-us-east-1
    Description: Bucket S3 que almacena las plantillas anidadas

  TemplatesPrefix:
    Type: String
    Default: anidados
    Description: Carpeta de las plantillas anidadas dentro de S3

Resources:

  # ==========================================
  # 1. RED
  # VPC, subred publica, Internet Gateway
  # y tabla de rutas
  # ==========================================

  Red:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${TemplatesPrefix}/red.yaml"
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente

  # ==========================================
  # 2. SEGURIDAD
  # Grupos de seguridad para frontend y backend
  # ==========================================

  Seguridad:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${TemplatesPrefix}/seguridad.yaml"
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
        VpcId: !GetAtt Red.Outputs.VpcId
        SshCidr: !Ref SshCidr

  # ==========================================
  # 3. SERVIDOR FRONTEND
  # ==========================================

  Frontend:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${TemplatesPrefix}/servidor.yaml"
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
        Rol: frontend
        TipoInstancia: !Ref TipoInstancia
        UbuntuAmi: !Ref UbuntuAmi
        LlavePublica: !Ref LlavePublica
        SubnetId: !GetAtt Red.Outputs.SubnetPublicaId
        SecurityGroupId: !GetAtt Seguridad.Outputs.FrontendSGId

  # ==========================================
  # 4. SERVIDOR BACKEND
  # ==========================================

  Backend:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.${AWS::Region}.${AWS::URLSuffix}/${TemplatesPrefix}/servidor.yaml"
      Parameters:
        Proyecto: !Ref Proyecto
        Ambiente: !Ref Ambiente
        Rol: backend
        TipoInstancia: !Ref TipoInstancia
        UbuntuAmi: !Ref UbuntuAmi
        LlavePublica: !Ref LlavePublica
        SubnetId: !GetAtt Red.Outputs.SubnetPublicaId
        SecurityGroupId: !GetAtt Seguridad.Outputs.BackendSGId



  # ==========================================
  # NUEVA INSTANCIA EC2 DE PRUEBA
  # ==========================================





          
        
    
Outputs:

  # IP publica del frontend
  IpFrontend:
    Description: IP publica del servidor frontend
    Value: !GetAtt Frontend.Outputs.IpPublica

  # IP publica del backend
  IpBackend:
    Description: IP publica del servidor backend
    Value: !GetAtt Backend.Outputs.IpPublica

  # Comando SSH para conectarse al frontend
  SshFrontend:
    Description: Comando SSH para el frontend
    Value: !Sub
      - "ssh -i ~/.ssh/aws-backend ubuntu@${IP}"
      - IP: !GetAtt Frontend.Outputs.IpPublica

  # Comando SSH para conectarse al backend
  SshBackend:
    Description: Comando SSH para el backend
    Value: !Sub
      - "ssh -i ~/.ssh/aws-backend ubuntu@${IP}"
      - IP: !GetAtt Backend.Outputs.IpPublica
