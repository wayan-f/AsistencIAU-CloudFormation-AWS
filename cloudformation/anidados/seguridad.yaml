AWSTemplateFormatVersion: "2010-09-09"
Description: AsistencIAU - Firewall frontend y backend
Parameters:
  Proyecto: {Type: String}
  Ambiente: {Type: String}
  VpcId: {Type: AWS::EC2::VPC::Id}
  SshCidr: {Type: String}
Resources:
  # Firewall del FRONTEND: SSH (22) y Web (80, 443)
  FrontendSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Frontend - permite SSH desde tu IP, HTTP y HTTPS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SshCidr, Description: SSH desde mi IP}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS}
      Tags:
        - {Key: Name, Value: !Sub '${Proyecto}-${Ambiente}-frontend-sg'}
        - {Key: Proyecto, Value: !Ref Proyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}
  # Firewall del BACKEND: SSH (22) y Web (80, 443), igual que el original
  BackendSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend - permite SSH desde tu IP, HTTP y HTTPS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SshCidr, Description: SSH desde mi IP}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS}
      Tags:
        - {Key: Name, Value: !Sub '${Proyecto}-${Ambiente}-backend-sg'}
        - {Key: Proyecto, Value: !Ref Proyecto}
        - {Key: Ambiente, Value: !Ref Ambiente}
Outputs:
  FrontendSGId: {Value: !GetAtt FrontendSG.GroupId}
  BackendSGId: {Value: !GetAtt BackendSG.GroupId}
